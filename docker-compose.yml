# Local infrastructure for Fluent.
#   docker compose up -d            → Postgres + MinIO (S3-compatible storage for recordings)
#   docker compose --profile livekit up -d → also a self-hosted LiveKit server (dev keys)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluent
      POSTGRES_PASSWORD: fluent
      POSTGRES_DB: fluent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluent"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fluent
      MINIO_ROOT_PASSWORD: fluentfluent
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 fluent fluentfluent;
      mc mb -p local/fluent-recordings || true;
      exit 0"

  # Optional: run the agent worker and the analysis worker in Docker (`docker compose --profile agent up`).
  # Needs `.env` at the repo root with provider keys and LIVEKIT_* (use host.docker.internal for a local LiveKit server).
  agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fluent:fluent@postgres:5432/fluent
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  analysis-worker:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    command: ["analysis-worker", "--watch"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fluent:fluent@postgres:5432/fluent
    depends_on:
      postgres:
        condition: service_healthy

  # Optional self-hosted LiveKit server (otherwise use LiveKit Cloud).
  livekit:
    profiles: ["livekit"]
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
  miniodata:
