[project]
name = "fluent-agent"
version = "0.1.0"
description = "Fluent — LiveKit voice agent worker and analysis engine"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents[deepgram,openai,cartesia,elevenlabs,silero,anthropic]==1.8.10",
  "livekit-api==1.2.2",
  "asyncpg==0.32.0",
  "pydantic==2.14.2",
  "structlog==26.1.0",
  "python-dotenv==1.2.4",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "types-PyYAML",
]

[project.scripts]
agent = "fluent_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluent_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["evals: tests that call a real LLM (skipped without OPENAI_API_KEY)"]
